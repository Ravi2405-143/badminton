<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sports Tournament Manager</title>
    <link rel="stylesheet" href="/static/css/style.css?v=1.3.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar (desktop) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>🏆 Sportify</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active" data-view="dashboard"><i class="fas fa-home"></i> Dashboard</li>
                    <li data-view="tournaments"><i class="fas fa-trophy"></i> Tournaments</li>
                    <li data-view="results"><i class="fas fa-history"></i> Recent Results</li>
                    <li data-view="rankings"><i class="fas fa-award"></i> Top Rankings</li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="btn-login" class="btn-secondary">Admin Login</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1 id="view-title">Dashboard</h1>
                <div class="user-profile">
                    <span id="user-role">Guest Mode</span>
                </div>
            </header>

            <div id="content-area" class="content-area">
                <!-- Dynamic Content Loads Here -->
                <div class="loader-container" id="loader">
                    <div class="loader"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottom-nav">
        <button class="bottom-nav-item active" data-view="dashboard">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </button>
        <button class="bottom-nav-item" data-view="tournaments">
            <i class="fas fa-trophy"></i>
            <span>Tournaments</span>
        </button>
        <button class="bottom-nav-item" data-view="results">
            <i class="fas fa-history"></i>
            <span>Results</span>
        </button>
        <button class="bottom-nav-item" data-view="rankings">
            <i class="fas fa-award"></i>
            <span>Rankings</span>
        </button>
        <button class="bottom-nav-item bottom-nav-login" id="btn-login-mobile">
            <i class="fas fa-user-shield"></i>
            <span>Admin</span>
        </button>
    </nav>

    <!-- Modals -->
    <div id="modal-container" class="modal-overlay hidden">
        <div class="modal">
            <header class="modal-header">
                <h3 id="modal-title">Title</h3>
                <button class="close-modal">&times;</button>
            </header>
            <div id="modal-content" class="modal-body">
                <!-- Modal Body -->
            </div>
        </div>
    </div>

    <script src="/static/js/api.js?v=1.3.0" defer></script>
    <script src="/static/js/components.js?v=1.3.0" defer></script>
    <script src="/static/js/app.js?v=1.3.0" defer></script>
</body>

</html>
